name: FloorFrame
options:
  bundleIdPrefix: cz.koval
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: U539BVM9GN
    CODE_SIGN_STYLE: Automatic
targets:
  FloorFrame:
    type: application
    platform: iOS
    sources: [FloorFrame]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: cz.koval.floorframe
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Floor Frame
        INFOPLIST_KEY_NSCameraUsageDescription: Floor Frame uses the camera to detect surfaces and place a life-size rectangle in your room.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    scheme: {}
